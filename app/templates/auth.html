<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weyrix - Вход и регистрация</title>
    <link rel="stylesheet" type="text/css" href="/static/css/main.css">
    <link rel="stylesheet" type="text/css" href="/static/css/themes/dark.css" id="theme-style">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-chat);
        }
        .auth-card {
            background: var(--bg-sidebar);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: var(--accent-primary);
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            background: var(--bg-input);
            border-radius: 8px;
            transition: all 0.3s;
            color: var(--text-primary);
        }
        .tab.active {
            background: var(--accent-primary);
            color: white;
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
        }
        .input-group {
            position: relative;
            margin: 10px 0;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            padding-right: 45px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            background: none;
            border: none;
            padding: 0;
            color: var(--text-secondary);
            transition: color 0.2s;
            width: auto;
            margin: 0;
        }
        .password-toggle:hover {
            color: var(--accent-primary);
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .auth-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="logo">
            <img src="/static/logotype.png" style="width: 60px; height: 60px; border-radius: 70%; border-color: black; border-style: solid; border-width: 2px;"></div>
        <h1>WEYRIX</h1>
        
        <div class="tabs">
            <div class="tab active" data-tab="login">Вход</div>
            <div class="tab" data-tab="register">Регистрация</div>
        </div>
        
        <!-- Форма входа -->
        <div id="loginForm" class="form active">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="Email">
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Пароль">
                <button type="button" class="password-toggle" id="loginToggleBtn">👁</button>
            </div>
            <button type="button" class="auth-btn" id="loginButton">Войти</button>
        </div>
        
        <!-- Форма регистрации -->
        <div id="registerForm" class="form">
            <div class="input-group">
                <input type="email" id="regEmail" placeholder="Email">
            </div>
            <div class="input-group">
                <input type="text" id="regName" placeholder="Имя">
            </div>
            <div class="input-group">
                <input type="password" id="regPassword" placeholder="Пароль">
            </div>
            <div class="input-group">
                <input type="password" id="regPasswordCheck" placeholder="Повторите пароль">
                <button type="button" class="password-toggle" id="registerToggleBtn">👁</button>
            </div>
            <button type="button" class="auth-btn" id="registerButton">Зарегистрироваться</button>
        </div>
    </div>
</div>

<script src="/static/js/settings.js"></script>
<script>
    // Переключение показа пароля для формы входа
    const loginToggleBtn = document.getElementById('loginToggleBtn');
    const loginPassword = document.getElementById('loginPassword');
    
    loginToggleBtn.addEventListener('click', () => {
        if (loginPassword.type === 'password') {
            loginPassword.type = 'text';
            loginToggleBtn.textContent = '⌣';
        } else {
            loginPassword.type = 'password';
            loginToggleBtn.textContent = '👁';
        }
    });
    
    // Переключение показа паролей для формы регистрации (оба поля сразу)
    const registerToggleBtn = document.getElementById('registerToggleBtn');
    const regPassword = document.getElementById('regPassword');
    const regPasswordCheck = document.getElementById('regPasswordCheck');
    let registerVisible = false;
    
    registerToggleBtn.addEventListener('click', () => {
        if (!registerVisible) {
            regPassword.type = 'text';
            regPasswordCheck.type = 'text';
            registerToggleBtn.textContent = '⌣';
            registerVisible = true;
        } else {
            regPassword.type = 'password';
            regPasswordCheck.type = 'password';
            registerToggleBtn.textContent = '👁';
            registerVisible = false;
        }
    });
    
    // Переключение вкладок
    const tabs = document.querySelectorAll('.tab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    
    function switchTab(tabName) {
        tabs.forEach(tab => tab.classList.remove('active'));
        document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
        
        if (tabName === 'login') {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
        } else {
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
        }
    }
    
    tabs.forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.getAttribute('data-tab')));
    });
    
    // Регистрация
    document.getElementById('registerButton').onclick = async () => {
        const data = {
            email: document.getElementById('regEmail').value,
            name: document.getElementById('regName').value,
            password: document.getElementById('regPassword').value,
            password_check: document.getElementById('regPasswordCheck').value
        };
        
        const response = await fetch('/auth/register/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        if (response.ok) {
            alert('Регистрация успешна! Теперь войдите.');
            switchTab('login');
            document.getElementById('regEmail').value = '';
            document.getElementById('regName').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regPasswordCheck').value = '';
        } else {
            alert(result.detail || 'Ошибка регистрации');
        }
    };
    
    // Вход
    document.getElementById('loginButton').onclick = async () => {
        const data = {
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
        };
        
        const response = await fetch('/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        if (response.ok) {
            window.location.href = '/chat';
        } else {
            alert(result.detail || 'Неверный email или пароль');
        }
    };
    
    // Загрузка темы при старте
    function loadThemeOnStart() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        const themeLink = document.getElementById('theme-style');
        if (themeLink) themeLink.href = `/static/css/themes/${savedTheme}.css`;
    }
    
    loadThemeOnStart();
</script>
</body>
</html>
