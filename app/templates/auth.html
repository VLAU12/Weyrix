<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weyrix - Вход и регистрация</title>
    <link rel="stylesheet" type="text/css" href="/static/css/main.css">
    <link rel="stylesheet" type="text/css" href="/static/css/themes/dark.css" id="theme-style">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-chat);
        }
        .auth-card {
            background: var(--bg-sidebar);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: var(--accent-primary);
        }
        h2 {
            font-size: 12px;
            margin-bottom: 10px;
            color: grey;
        }
        h3 {
            font-size: 12px;
            margin-bottom: 30px;
            color: grey;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            background: var(--bg-input);
            border-radius: 8px;
            transition: all 0.3s;
            color: var(--text-primary);
        }
        .tab.active {
            background: var(--accent-primary);
            color: white;
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
        }
        input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="logo">.</div>
        <h1>WEYRIX</h1>
        <h2>Добро пожаловать в мессенджер Weyrix!</h2>
        <h3>Пожалуйста, пройдите регистрацию и войдите в свой аккаунт</h3>

        
        <div class="tabs">
            <div class="tab active" data-tab="login">Вход</div>
            <div class="tab" data-tab="register">Регистрация</div>
        </div>
        
        <div id="loginForm" class="form active">
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Пароль">
            <button id="loginButton">Войти</button>
        </div>
        
        <div id="registerForm" class="form">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="text" id="regName" placeholder="Имя">
            <input type="password" id="regPassword" placeholder="Пароль">
            <input type="password" id="regPasswordCheck" placeholder="Повторите пароль">
            <button id="registerButton">Зарегистрироваться</button>
        </div>
    </div>
</div>

<script>
    const tabs = document.querySelectorAll('.tab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    
    function switchTab(tabName) {
        tabs.forEach(tab => tab.classList.remove('active'));
        document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
        if (tabName === 'login') {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
        } else {
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
        }
    }
    
    tabs.forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.getAttribute('data-tab')));
    });
    
    document.getElementById('registerButton').onclick = async () => {
        const data = {
            email: document.getElementById('regEmail').value,
            name: document.getElementById('regName').value,
            password: document.getElementById('regPassword').value,
            password_check: document.getElementById('regPasswordCheck').value
        };
        const response = await fetch('/auth/register/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (response.ok) {
            alert('Регистрация успешна! Теперь войдите.');
            switchTab('login');
        } else {
            alert(result.detail || 'Ошибка регистрации');
        }
    };
    
    document.getElementById('loginButton').onclick = async () => {
        const data = {
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
        };
        const response = await fetch('/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (response.ok) {
            window.location.href = '/chat';
        } else {
            alert(result.detail || 'Неверный email или пароль');
        }
    };
</script>
</body>
</html>
