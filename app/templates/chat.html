<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weyrix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; }
        .app { display: flex; height: 100vh; }
        
        /* Сайдбар с диалогами */
        .sidebar { width: 350px; background: #2c3e50; color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; background: #1a252f; border-bottom: 1px solid #34495e; }
        .profile-link { color: white; text-decoration: none; display: block; margin-bottom: 10px; }
        
        /* Поиск */
        .search-box { padding: 15px; border-bottom: 1px solid #34495e; }
        .search-box input { width: 100%; padding: 10px; border: none; border-radius: 5px; }
        .search-box button { width: 100%; margin-top: 10px; padding: 8px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        
        /* Список диалогов */
        .dialogs-list { flex: 1; overflow-y: auto; }
        .dialog-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #34495e; transition: background 0.3s; }
        .dialog-item:hover { background: #34495e; }
        .dialog-item.active { background: #007bff; }
        .dialog-name { font-weight: bold; margin-bottom: 5px; }
        .dialog-preview { font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dialog-time { font-size: 10px; color: #888; margin-top: 5px; }
        
        /* Область чата */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: white; }
        .chat-header { padding: 20px; background: #007bff; color: white; display: flex; justify-content: space-between; align-items: center; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; background: #f8f9fa; }
        .message { margin-bottom: 15px; display: flex; }
        .my-message { justify-content: flex-end; }
        .other-message { justify-content: flex-start; }
        .message-bubble { max-width: 60%; padding: 10px 15px; border-radius: 18px; word-wrap: break-word; }
        .my-message .message-bubble { background: #007bff; color: white; }
        .other-message .message-bubble { background: #e9ecef; color: black; }
        .message-time { font-size: 10px; margin-top: 5px; opacity: 0.7; }
        .input-area { display: flex; padding: 20px; background: white; border-top: 1px solid #ddd; gap: 10px; }
        .input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 25px; }
        .input-area button { padding: 10px 30px; background: #007bff; color: white; border: none; border-radius: 25px; cursor: pointer; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .welcome { text-align: center; color: #999; padding: 50px; }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="/auth/profile" class="profile-link">{{ user.name }} (ID: {{ user.id }})</a>
        </div>
        
        <div class="search-box">
            <input type="number" id="searchId" placeholder="Введите ID пользователя для нового чата">
            <button onclick="searchAndStartChat()">Найти и начать чат</button>
        </div>
        
        <div class="dialogs-list" id="dialogsList">
            {% for dialog in dialogs %}
            <div class="dialog-item" data-user-id="{{ dialog.user_id }}" onclick="selectDialog({{ dialog.user_id }}, '{{ dialog.user_name }}')">
                <div class="dialog-name">{{ dialog.user_name }}</div>
                <div class="dialog-preview">{{ dialog.last_message or 'Новое сообщение' }}</div>
                <div class="dialog-time">{{ dialog.last_message_time.strftime('%d.%m %H:%M') if dialog.last_message_time else '' }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
    
    <div class="chat-area">
        <div class="chat-header" id="chatHeader">
            <span>Выберите чат</span>
            <button onclick="logout()" style="padding: 5px 15px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">Выход</button>
        </div>
        <div class="messages" id="messages">
            <div class="welcome">Выберите чат для общения</div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Введите сообщение..." disabled>
            <button id="sendButton" disabled>Отправить</button>
        </div>
    </div>
</div>

<script>
    const currentUserId = {{ user.id }};
    let currentUserId_chat = null;
    let socket = null;
    let dialogs = new Map();
    
    // Загружаем существующие диалоги
    {% for dialog in dialogs %}
    dialogs.set({{ dialog.user_id }}, {
        name: '{{ dialog.user_name }}',
        lastMessage: '{{ dialog.last_message or "" }}',
        lastMessageTime: '{{ dialog.last_message_time.strftime("%d.%m %H:%M") if dialog.last_message_time else "" }}'
    });
    {% endfor %}
    
    async function logout() {
        await fetch('/auth/logout/', { method: 'POST' });
        window.location.href = '/auth';
    }
    
    async function searchAndStartChat() {
        const userId = document.getElementById('searchId').value;
        if (!userId) {
            alert('Введите ID пользователя');
            return;
        }
        
        const response = await fetch(`/auth/search/${userId}`);
        if (response.ok) {
            const user = await response.json();
            if (user && user.id != currentUserId) {
                addDialog(user.id, user.name);
                selectDialog(user.id, user.name);
                document.getElementById('searchId').value = '';
            } else if (user.id == currentUserId) {
                alert('Нельзя начать чат с самим собой');
            } else {
                alert('Пользователь не найден');
            }
        } else {
            alert('Пользователь не найден');
        }
    }
    
    function addDialog(userId, userName) {
        if (!dialogs.has(userId)) {
            dialogs.set(userId, { name: userName, lastMessage: '', lastMessageTime: '' });
            updateDialogsList();
        }
    }
    
    function updateDialogsList() {
        const container = document.getElementById('dialogsList');
        container.innerHTML = '';
        
        for (const [userId, dialog] of dialogs) {
            const dialogDiv = document.createElement('div');
            dialogDiv.className = 'dialog-item' + (currentUserId_chat === userId ? ' active' : '');
            dialogDiv.setAttribute('data-user-id', userId);
            dialogDiv.onclick = () => selectDialog(userId, dialog.name);
            dialogDiv.innerHTML = `
                <div class="dialog-name">${dialog.name}</div>
                <div class="dialog-preview">${dialog.lastMessage || 'Новое сообщение'}</div>
                <div class="dialog-time">${dialog.lastMessageTime}</div>
            `;
            container.appendChild(dialogDiv);
        }
    }
    
    async function selectDialog(userId, userName) {
        if (userId === currentUserId_chat) return;
        
        currentUserId_chat = userId;
        document.getElementById('chatHeader').innerHTML = `<span>Чат с ${userName}</span><button onclick="logout()" style="padding: 5px 15px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">Выход</button>`;
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendButton').disabled = false;
        
        await loadMessages(userId);
        connectWebSocket();
        updateDialogsList();
    }
    
    async function loadMessages(userId) {
        const response = await fetch(`/chat/dialog/${userId}`);
        const messages = await response.json();
        
        const container = document.getElementById('messages');
        if (messages.length === 0) {
            container.innerHTML = '<div class="welcome">Напишите первое сообщение!</div>';
        } else {
            container.innerHTML = messages.map(msg => `
                <div class="message ${msg.sender_id === currentUserId ? 'my-message' : 'other-message'}">
                    <div class="message-bubble">
                        ${msg.content}
                        <div class="message-time">${new Date(msg.created_at).toLocaleTimeString()}</div>
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }
    }
    
    function connectWebSocket() {
        if (socket) socket.close();
        socket = new WebSocket(`wss://${window.location.host}/chat/ws/${currentUserId}`);
        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            const otherUserId = msg.sender_id === currentUserId ? msg.recipient_id : msg.sender_id;
            
            // Обновляем или добавляем диалог
            if (!dialogs.has(otherUserId)) {
                fetch(`/auth/search/${otherUserId}`).then(r => r.json()).then(user => {
                    if (user) addDialog(otherUserId, user.name);
                });
            }
            
            // Обновляем последнее сообщение
            const dialog = dialogs.get(otherUserId);
            if (dialog) {
                dialog.lastMessage = msg.content.substring(0, 50);
                dialog.lastMessageTime = new Date().toLocaleTimeString();
                updateDialogsList();
            }
            
            // Если открыт этот чат, показываем сообщение
            if (currentUserId_chat === otherUserId) {
                const container = document.getElementById('messages');
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.sender_id === currentUserId ? 'my-message' : 'other-message'}`;
                messageDiv.innerHTML = `<div class="message-bubble">${msg.content}<div class="message-time">${new Date().toLocaleTimeString()}</div></div>`;
                container.appendChild(messageDiv);
                container.scrollTop = container.scrollHeight;
            }
        };
    }
    
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (message && currentUserId_chat) {
            await fetch('/chat/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ recipient_id: currentUserId_chat, content: message })
            });
            input.value = '';
        }
    }
    
    document.getElementById('sendButton').onclick = sendMessage;
    document.getElementById('messageInput').onkeypress = (e) => {
        if (e.key === 'Enter') sendMessage();
    };
</script>
</body>
</html>
