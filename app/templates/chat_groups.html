<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вейрикс (Weyrix) - удобное и безопасное общение</title>
    <meta name="description" content="Weyrix представаляет собой быстрый, безопасный и стильный чат для общения. Присоединяйтесь к мессенджеру Вейрикс (Weyrix), так мы сможем вместе сделать мессенджер лучше!">
    <meta name="keywords" content="мессенджер, чат, общение, безопасный чат, weyrix, вейрикс, Weyrix, сообщения">
    <link rel="stylesheet" type="text/css" href="/static/css/main.css">
    <link rel="stylesheet" type="text/css" href="/static/css/themes/dark.css" id="theme-style">
</head>
<body>
<div class="app">
    <!-- Боковая панель -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div style="position: relative;">
                <button class="menu-button" id="menuButton">⋮</button>
                <div class="menu-dropdown" id="menuDropdown">
                    <div class="menu-item" id="profileBtn" data-i18n="profile">Аккаунт</div>
                    <div class="menu-item" id="settingsBtn" data-i18n="settings">Настройки</div>
                    <div class="menu-item" id="logoutBtn" data-i18n="logout">Выйти</div>
                </div>
            </div>
            <div>{{ user.name }} (<span data-i18n="your_id">ID</span>: {{ user.user_tag }})</div>
        </div>

        <div class="search-box">
            <input type="text" id="searchId" data-i18n="search_user" placeholder="Введите ID пользователя">
            <button id="searchBtn" data-i18n="search"></button>
        </div>

        <div class="create-group">
            <button id="createGroupBtn" data-i18n="create_group">Создать групповой чат</button>
        </div>

        <div class="chats-list" id="chatsList"></div>
    </div>
    
    <!-- Область чата -->
    <div class="chat-area">
        <div class="chat-header" id="chatHeader">
            <span>Weyrix</span>
            <div class="room-actions" id="roomActions"></div>
        </div>
        <div class="messages" id="messages">
            <div class="welcome-background">
                <div class="logo-container">
                    <img src="/static/logotype.png" class="welcome-logo"; >
                    <h2 class="welcome-title">WEYRIX</h2>
                    <p class="welcome-text" data-i18n="welcome">Выберите чат для общения</p>
                </div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" data-i18n="enter_message" placeholder="Введите сообщение..." disabled>
            <button id="sendBtn" data-i18n="send" disabled>Отправить</button>
            <button class="attach-button" id="attachBtn" data-i18n="attach">📎</button>
        </div>
    </div>
</div>

<!-- Модальные окна -->
<div class="modal-overlay" id="settingsOverlay"></div>
<div class="modal-settings" id="settingsModal">
    <h3 data-i18n="settings">Настройки</h3>
    <div class="setting-item">
        <label data-i18n="theme">Тема</label>
        <select id="themeSelect">
            <option value="dark">Тёмная</option>
            <option value="light">Светлая</option>
        </select>
    </div>
    <div class="setting-item">
        <label data-i18n="language">Язык</label>
        <select id="languageSelect">
            <option value="ru">Русский</option>
            <option value="en">English</option>
        </select>
    </div>
    <button id="saveSettingsBtn" data-i18n="save">Сохранить</button>
    <button id="cancelSettingsBtn" data-i18n="cancel">Отмена</button>
</div>

<div class="modal-overlay" id="groupOverlay"></div>
<div class="modal-settings" id="groupModal">
    <h3 data-i18n="create_group">Создать групповой чат</h3>
    <input type="text" id="groupName" data-i18n="group_name" placeholder="Название группы">
    <textarea id="groupDesc" data-i18n="group_desc" placeholder="Описание" rows="3"></textarea>
    <button id="confirmGroupBtn" data-i18n="create">Создать</button>
    <button id="cancelGroupBtn" data-i18n="cancel">Отмена</button>
</div>

<!-- Модальное окно информации о группе -->
<div class="modal-overlay" id="groupInfoOverlay"></div>
<div class="modal-settings" id="groupInfoModal" style="width: 400px;">
    <h3 id="groupInfoTitle" data-i18n="group_info">Информация о группе</h3>
    <div id="groupInfoContent">
        <div class="info-item">
            <div class="info-label" data-i18n="group_name">Название</div>
            <div class="info-value" id="groupInfoName"></div>
        </div>
        <div class="info-item">
            <div class="info-label" data-i18n="group_desc">Описание</div>
            <div class="info-value" id="groupInfoDesc"></div>
        </div>
        <div class="info-item">
            <div class="info-label" data-i18n="members">Участники</div>
            <div class="info-value" id="groupInfoMembers" style="max-height: 200px; overflow-y: auto;"></div>
        </div>
    </div>
    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button id="inviteToGroupBtn" style="flex: 1;" data-i18n="invite"> Пригласить</button>
        <button id="leaveGroupBtn" style="flex: 1;" data-i18n="leave_group"> Покинуть чат</button>
        <button id="closeGroupInfoBtn" style="flex: 1;" data-i18n="close">Закрыть</button>
    </div>
</div>
<input type="file" id="fileInput" style="display: none;">

<script src="/static/js/settings.js"></script>
<script>
    const currentUserId = {{ user.id }};
    const currentUserTag = "{{ user.user_tag }}";
    
    let currentChatId = null;
    let currentChatIsPrivate = false;
    let socket = null;
    let chats = new Map();

    const menuButton = document.getElementById('menuButton');
    const menuDropdown = document.getElementById('menuDropdown');
    const profileBtn = document.getElementById('profileBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const searchBtn = document.getElementById('searchBtn');
    const searchId = document.getElementById('searchId');
    const createGroupBtn = document.getElementById('createGroupBtn');
    const attachBtn = document.getElementById('attachBtn');
    const sendBtn = document.getElementById('sendBtn');
    const messageInput = document.getElementById('messageInput');
    const fileInput = document.getElementById('fileInput');
    const chatsList = document.getElementById('chatsList');
    const messagesDiv = document.getElementById('messages');
    const chatHeader = document.getElementById('chatHeader');
    const roomActions = document.getElementById('roomActions');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const settingsModal = document.getElementById('settingsModal');
    const themeSelect = document.getElementById('themeSelect');
    const languageSelect = document.getElementById('languageSelect');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const cancelSettingsBtn = document.getElementById('cancelSettingsBtn');
    const groupOverlay = document.getElementById('groupOverlay');
    const groupModal = document.getElementById('groupModal');
    const groupName = document.getElementById('groupName');
    const groupDesc = document.getElementById('groupDesc');
    const confirmGroupBtn = document.getElementById('confirmGroupBtn');
    const cancelGroupBtn = document.getElementById('cancelGroupBtn');

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    async function loadChats() {
        const response = await fetch('/chat/chats');
        const chatsData = await response.json();
        chatsList.innerHTML = '';
        
        for (const chat of chatsData) {
            const chatDiv = document.createElement('div');
            chatDiv.className = 'chat-item' + (currentChatId === chat.id ? ' active' : '');
            chatDiv.setAttribute('data-chat-id', chat.id);
            chatDiv.onclick = () => selectChat(chat.id);
            chatDiv.innerHTML = `
                <div class="chat-name">${escapeHtml(chat.name)} ${chat.is_private ? '🔒' : '👥'}</div>
                <div class="chat-preview">${escapeHtml(chat.last_message || 'Новое сообщение')}</div>
            `;
            chatsList.appendChild(chatDiv);
            chats.set(chat.id, { name: chat.name, isPrivate: chat.is_private, lastMessage: chat.last_message });
        }
    }
    
    function addMessageToScreen(message) {
        const welcome = messagesDiv.querySelector('.welcome');
        if (welcome) welcome.remove();
        
        const isMyMessage = message.sender_id === currentUserId;
        const isSystem = message.is_system;
        
        let messageClass = '';
        if (isSystem) messageClass = 'system-message';
        else if (isMyMessage) messageClass = 'my-message';
        else messageClass = 'other-message';
        
        let content = escapeHtml(message.content);
        const fileMatch = content.match(/📎 Файл: (.+?)\n(.+)/);
        if (fileMatch) {
            const fileName = fileMatch[1];
            const fileUrl = fileMatch[2];
            content = `📎 <a href="${fileUrl}" target="_blank" class="file-link" download>${fileName}</a>`;
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${messageClass}`;
        messageDiv.setAttribute('data-message-id', message.id);
        messageDiv.innerHTML = `
            <div class="message-bubble">
                ${!isSystem && !isMyMessage ? '<div class="message-name">Пользователь</div>' : ''}
                ${content}
                <div class="message-time">${new Date(message.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
            </div>
        `;
        messagesDiv.appendChild(messageDiv);
        messagesDiv.classList.add('has-messages');
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    async function loadMessages(chatId) {
        const response = await fetch(`/chat/${chatId}/messages`);
        const messages = await response.json();
        messagesDiv.innerHTML = '';
        
        if (messages.length === 0) {
            messagesDiv.innerHTML = '<div class="welcome">Напишите первое сообщение!</div>';
            messagesDiv.classList.remove('has-messages');
        } else {
            for (const msg of messages) {
                addMessageToScreen(msg);
            }
            messagesDiv.classList.add('has-messages');
        }
    }
    
        async function selectChat(chatId) {
        if (!chatId) return;
        
        hideWelcomeBackground();
        currentChatId = chatId;
        
        const infoResponse = await fetch(`/chat/${chatId}/info`);
        const chatInfo = await infoResponse.json();
        currentChatIsPrivate = chatInfo.is_private;
        
        let otherUserName = chatInfo.name;
        let otherUserId = null;
        
        const isFavorites = chatInfo.name === 'Избранное';
        
        if (currentChatIsPrivate && !isFavorites) {
            const participantsResponse = await fetch(`/chat/${chatId}/members`);
            const participants = await participantsResponse.json();
            const otherUser = participants.find(u => u.id !== currentUserId);
            if (otherUser) {
                otherUserId = otherUser.id;
                otherUserName = otherUser.name;
            }
        }
        
        let buttonsHtml = '';
        
        if (!currentChatIsPrivate && !isFavorites) {
            buttonsHtml += `<button class="info-chat" onclick="openGroupInfo()" data-i18n="group_info"> Информация</button>`;
        } else if (currentChatIsPrivate && !isFavorites) {
            buttonsHtml += `<button class="leave-chat" onclick="leaveChat()" data-i18n="delete_chat"> Удалить чат</button>`;
        }
        
        let chatNameDisplay = '';
        if (isFavorites) {
            chatNameDisplay = ' Избранное';
        } else if (currentChatIsPrivate) {
            chatNameDisplay = `<a href="#" onclick="viewUserProfile(${otherUserId}); return false;" style="color: inherit; text-decoration: none;">💬 ${escapeHtml(otherUserName)}</a>`;
        } else {
            chatNameDisplay = `<a href="#" onclick="openGroupInfo(); return false;" style="color: inherit; text-decoration: none;">👥 ${escapeHtml(chatInfo.name)}</a>`;
        }
        
        chatHeader.innerHTML = `<span>${chatNameDisplay}</span>`;
        roomActions.innerHTML = buttonsHtml;
        
        messageInput.disabled = false;
        sendBtn.disabled = false;
        
        await loadMessages(chatId);
        connectWebSocket();
        
        document.querySelectorAll('.chat-item').forEach(item => {
            item.classList.remove('active');
            if (parseInt(item.getAttribute('data-chat-id')) === chatId) {
                item.classList.add('active');
            }
        });
    }

    function viewUserProfile(userId) {
        if (userId) {
            window.location.href = `/auth/user/${userId}/profile`;
        }
    }
    
    async function startPrivateChat() {
        const userTag = searchId.value.trim();
        if (!userTag) {
            alert('Введите ID пользователя в формате Wxxxxxxx');
            return;
        }
        
        if (userTag === currentUserTag) {
            alert('Нельзя начать чат с самим собой');
            return;
        }
        
        try {
            const searchResponse = await fetch(`/auth/search/${userTag}`);
            const user = await searchResponse.json();
            
            if (user && user.id) {
                const privateResponse = await fetch(`/chat/private/create/${user.id}`, { method: 'POST' });
                if (privateResponse.ok) {
                    const room = await privateResponse.json();
                    searchId.value = '';
                    await loadChats();
                    selectChat(room.id);
                } else {
                    alert('Ошибка создания чата');
                }
            } else {
                alert('Пользователь не найден');
            }
        } catch (error) {
            console.error('Search error:', error);
            alert('Ошибка поиска пользователя');
        }
    }
    
    window.addMemberToGroup = async function() {
        const userId = prompt('Введите ID пользователя для добавления в группу:');
        if (userId && currentChatId) {
            const response = await fetch(`/chat/${currentChatId}/add_member/${userId}`, { method: 'POST' });
            const result = await response.json();
            alert(result.message);
            if (response.ok) {
                await loadMessages(currentChatId);
            }
        }
    };
    
    window.leaveChat = async function() {
        const confirmMessage = currentChatIsPrivate ? 
            'Вы уверены, что хотите удалить этот чат? Все сообщения будут потеряны.' : 
            'Вы уверены, что хотите покинуть этот чат?';
        
        if (confirm(confirmMessage)) {
            const response = await fetch(`/chat/${currentChatId}/leave`, { method: 'POST' });
            if (response.ok) {
                currentChatId = null;
                await loadChats();
                chatHeader.innerHTML = '<span>Weyrix</span>';
                roomActions.innerHTML = '';
                showWelcomeBackground();
                messageInput.disabled = true;
                sendBtn.disabled = true;
                if (socket) {
                    socket.close();
                    socket = null;
                }
            }
        }
    };
    
    function showGroupModal() {
        groupOverlay.style.display = 'block';
        groupModal.style.display = 'block';
    }
    
    function closeGroupModal() {
        groupOverlay.style.display = 'none';
        groupModal.style.display = 'none';
        groupName.value = '';
        groupDesc.value = '';
    }
    
    async function createGroup() {
        const name = groupName.value;
        const description = groupDesc.value;
        
        if (!name) {
            alert('Введите название группы');
            return;
        }
        
        const response = await fetch('/chat/groups/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, description })
        });
        
        if (response.ok) {
            const room = await response.json();
            closeGroupModal();
            await loadChats();
            selectChat(room.id);
        } else {
            alert('Ошибка создания группы');
        }
    }
    
    function connectWebSocket() {
        if (socket) socket.close();
        
        socket = new WebSocket(`wss://${window.location.host}/chat/ws/${currentUserId}`);
        
        socket.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.room_id === currentChatId) {
                    addMessageToScreen(msg);
                    loadChats();
                }
            } catch (e) {
                console.error('Error parsing message:', e);
            }
        };
        
        socket.onclose = () => {
            setTimeout(() => {
                if (currentChatId) connectWebSocket();
            }, 3000);
        };
    }
    
        async function sendMessage() {
        const message = messageInput.value.trim();
        
        if (message && currentChatId) {
            const tempMessage = {
                id: Date.now(),
                room_id: currentChatId,
                sender_id: currentUserId,
                content: message,
                created_at: new Date().toISOString(),
                is_system: false
            };
            
            addMessageToScreen(tempMessage);
            messageInput.value = '';
            
            const response = await fetch(`/chat/${currentChatId}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: message })
            });
            
            if (response.ok) {
                loadChats();
            } else {
                alert('Ошибка при отправке сообщения');
            }
        }
    }
    
    function attachFile() {
        fileInput.click();
    }
    
    async function uploadFile(file) {
        const formData = new FormData();
        formData.append('file', file);
        if (currentChatId) formData.append('room_id', currentChatId);
        
        const response = await fetch('/chat/upload', { method: 'POST', body: formData });
        
        if (response.ok) {
            const data = await response.json();
            const message = `📎 Файл: ${file.name}\n${data.file_url}`;
            await fetch(`/chat/${currentChatId}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: message })
            });
        }
    }
    
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) uploadFile(e.target.files[0]);
        e.target.value = '';
    });
    
    function openSettings() {
        settingsOverlay.style.display = 'block';
        settingsModal.style.display = 'block';
        themeSelect.value = localStorage.getItem('theme') || 'dark';
        languageSelect.value = localStorage.getItem('language') || 'ru';
    }
    
    function closeSettings() {
        settingsOverlay.style.display = 'none';
        settingsModal.style.display = 'none';
    }
    
    function saveSettings() {
        const theme = themeSelect.value;
        const language = languageSelect.value;
        localStorage.setItem('theme', theme);
        localStorage.setItem('language', language);
        document.getElementById('theme-style').href = `/static/css/themes/${theme}.css`;
        location.reload();
    }
    
    async function logout() {
        await fetch('/auth/logout/', { method: 'POST' });
        window.location.href = '/auth';
    }
    
    function toggleMenu() {
        menuDropdown.classList.toggle('show');
    }
    
    function showWelcomeBackground() {
        const inputArea = document.querySelector('.input-area');
        messagesDiv.innerHTML = `
            <div class="welcome-background">
                <div class="logo-container">
                    <img src="/static/logotupe.png" class="welcome-logo">
                    <h2 class="welcome-title">WEYRIX</h2>
                    <p class="welcome-text" data-i18n="welcome">Выберите чат для общения</p>
                </div>
            </div>
        `;
        if (inputArea) inputArea.classList.add('disabled');
    }
    
    function hideWelcomeBackground() {
        const inputArea = document.querySelector('.input-area');
        if (inputArea) inputArea.classList.remove('disabled');
    }
    
    // Обработчики событий
    menuButton.addEventListener('click', toggleMenu);
    document.addEventListener('click', (e) => {
        if (!menuButton.contains(e.target) && !menuDropdown.contains(e.target)) {
            menuDropdown.classList.remove('show');
        }
    });
    
    profileBtn.addEventListener('click', () => window.location.href = '/auth/profile');
    settingsBtn.addEventListener('click', openSettings);
    logoutBtn.addEventListener('click', logout);
    searchBtn.addEventListener('click', startPrivateChat);
    createGroupBtn.addEventListener('click', showGroupModal);
    attachBtn.addEventListener('click', attachFile);
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    settingsOverlay.addEventListener('click', closeSettings);
    saveSettingsBtn.addEventListener('click', saveSettings);
    cancelSettingsBtn.addEventListener('click', closeSettings);
    groupOverlay.addEventListener('click', closeGroupModal);
    confirmGroupBtn.addEventListener('click', createGroup);
    cancelGroupBtn.addEventListener('click', closeGroupModal);

    
    // Обработка кликов по ссылкам на файлы
    messagesDiv.addEventListener('click', (e) => {
        const link = e.target.closest('.file-link');
        if (link) {
            e.preventDefault();
            window.open(link.getAttribute('href'), '_blank');
        }
    });
    
    
    async function openGroupInfo() {
        if (!currentChatId) return;
        
        try {
            const infoResponse = await fetch(`/chat/${currentChatId}/info`);
            const chatInfo = await infoResponse.json();
            
            document.getElementById('groupInfoName').textContent = chatInfo.name || 'Без названия';
            document.getElementById('groupInfoDesc').textContent = chatInfo.description || 'Нет описания';
            
            const membersResponse = await fetch(`/chat/${currentChatId}/members`);
            const members = await membersResponse.json();
            
            let membersList = document.createElement('div');
            membersList.className = 'members-list';
            
            members.forEach((member, index) => {
                const memberDiv = document.createElement('div');
                memberDiv.className = 'member-item';
                memberDiv.style.cssText = 'padding: 8px; cursor: pointer; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px;';
                memberDiv.onclick = () => {
                    closeGroupInfo();
                    viewUserProfile(member.id);
                };
                
                const avatar = document.createElement('div');
                avatar.style.cssText = 'width: 32px; height: 32px; border-radius: 50%; background: var(--accent-primary); display: flex; align-items: center; justify-content: center; font-size: 16px;';
                avatar.textContent = member.avatar ? '📷' : '👤';
                
                const info = document.createElement('div');
                info.style.cssText = 'flex: 1;';
                info.innerHTML = `
                    <div style="font-weight: bold;">${escapeHtml(member.name)}</div>
                    <div style="font-size: 11px; opacity: 0.7;">${member.user_tag || member.id}</div>
                `;
                
                memberDiv.appendChild(avatar);
                memberDiv.appendChild(info);
                membersList.appendChild(memberDiv);
            });
            
            const container = document.getElementById('groupInfoMembers');
            container.innerHTML = '';
            container.appendChild(membersList);
            
            document.getElementById('groupInfoOverlay').style.display = 'block';
            document.getElementById('groupInfoModal').style.display = 'block';
            
        } catch (error) {
            console.error('Error loading group info:', error);
            alert('Ошибка загрузки информации о группе');
        }
    }

    function closeGroupInfo() {
        document.getElementById('groupInfoOverlay').style.display = 'none';
        document.getElementById('groupInfoModal').style.display = 'none';
    }

    async function inviteToGroup() {
        const userId = prompt('Введите ID пользователя для приглашения (формат: Wxxxxxxx):');
        if (userId && currentChatId) {
            try {
                const searchResponse = await fetch(`/auth/search/${userId}`);
                const user = await searchResponse.json();
                
                if (user && user.id) {
                    const response = await fetch(`/chat/${currentChatId}/add_member/${user.id}`, { method: 'POST' });
                    const result = await response.json();
                    alert(result.message || 'Пользователь добавлен');
                    if (response.ok) {
                        closeGroupInfo();
                        await loadMessages(currentChatId);
                    }
                } else {
                    alert('Пользователь не найден');
                }
            } catch (error) {
                console.error('Error inviting user:', error);
                alert('Ошибка при приглашении');
            }
        }
    }

    async function leaveGroup() {
        if (confirm('Вы уверены, что хотите покинуть этот чат?')) {
            const response = await fetch(`/chat/${currentChatId}/leave`, { method: 'POST' });
            if (response.ok) {
                closeGroupInfo();
                currentChatId = null;
                await loadChats();
                chatHeader.innerHTML = '<span>Weyrix</span>';
                roomActions.innerHTML = '';
                showWelcomeBackground();
                messageInput.disabled = true;
                sendBtn.disabled = true;
                if (socket) {
                    socket.close();
                    socket = null;
                }
            }
        }
    }

    // Инициализация
